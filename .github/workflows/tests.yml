name: tests

on:
  push:
  pull_request:

jobs:
  gameplay-tests:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.6.3
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Run headless gameplay tests
        run: tools/run_tests.sh
      - name: Verify asset budgets and texture import settings
        run: |
          python3 tools/art/configure_texture_imports.py --check
          python3 tools/art/audit_asset_budgets.py --check-budgets --output tests/output/asset_budgets_ci.json
          python3 tests/test_asset_budget_checks.py
      - name: Run portable saves and expanded encounters
        run: |
          export XDG_DATA_HOME="$PWD/tools/runtime/engine_data"
          export XDG_CACHE_HOME="$PWD/tools/runtime/engine_cache"
          export TMPDIR="$PWD/tools/runtime/tmp"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CACHE_HOME" "$TMPDIR"
          for scene in stage12 auto_save checkpoint_climb campaign_expansion colossi_v3 travelers_v3 temple_characters_v3 art_integration_v3 paired_arrival weapon_art graphics_quality texture_budgets main_layout forbidden_lands world_climate climate_view climate_persistence climate_shelter; do
            limit=200000
            if [ "$scene" = "forbidden_lands" ]; then limit=660000; fi
            "$GODOT" --headless --fixed-fps 60 --quit-after "$limit" "res://tests/${scene}.tscn"
          done
      - name: Verify optional companion and decision boundary
        run: |
          python3 tools/run_companion_tests.py --godot "$GODOT"
          python3 tests/test_local_decision.py
          python3 tests/test_local_decision_http.py
      - name: Verify core PCVR without a headset
        run: python3 tools/run_vr_tests.py --godot "$GODOT"
      - name: Verify biome blending and groundcover
        run: python3 tools/run_environment_tests.py --godot "$GODOT"
